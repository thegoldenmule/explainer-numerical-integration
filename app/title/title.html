<!--
  Title page: row 0 of the spine, route #/0, the landing route when there is no hash.
  main.js fetches this fragment into the title cell and mounts ./title.js on it; it is not
  a manifest panel and does not go through the pane loader. Self-contained on purpose: its
  styles live here, scoped under .title, and read only the tokens base.css defines.
-->
<section class="title" aria-label="Title">
<style>
  .title {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    display: grid;
    grid-template-rows: 1fr auto;
    isolation: isolate;
  }

  /* ---- background collage ---- */
  .title .gifs {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .title .gifs img {
    position: absolute;
    /* --x, --y, --w, --dur, --grow are set per element by title.js */
    left: var(--x);
    top: var(--y);
    width: var(--w);
    height: auto;
    max-width: 90vw;
    translate: -50% -50%;
    border-radius: 6px;
    opacity: 0;
    will-change: opacity, transform;
    animation: title-drift var(--dur) ease-in-out forwards;
    filter: saturate(0.85);
  }
  @keyframes title-drift {
    0%   { opacity: 0; transform: scale(1); }
    18%  { opacity: 1; }
    82%  { opacity: 1; }
    100% { opacity: 0; transform: scale(var(--grow)); }
  }

  /* wash between gifs and text so the title always reads */
  .title .wash {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 55% 40% at 50% 48%, rgba(251, 250, 247, 0.9), rgba(251, 250, 247, 0.45) 70%, rgba(251, 250, 247, 0.18));
  }

  /* ---- foreground ---- */
  .title .hero {
    position: relative;
    z-index: 2;
    display: grid;
    place-items: center;
    padding: 2rem;
    text-align: center;
  }
  .title h1 {
    margin: 0;
    font-size: clamp(2.4rem, 7vw, 6rem);
    font-weight: 650;
    line-height: 1.05;
    letter-spacing: -0.025em;
    text-wrap: balance;
    max-width: 14ch;
    text-shadow: 0 0 24px rgba(251, 250, 247, 0.9), 0 0 60px rgba(251, 250, 247, 0.8);
  }

  .title .directions {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    gap: clamp(1.5rem, 5vw, 4rem);
    padding: 1.5rem 1.5rem 2rem;
    color: var(--muted);
    font-size: 0.95rem;
    background: linear-gradient(to top, rgba(251, 250, 247, 0.95), rgba(251, 250, 247, 0));
  }
  .title .directions div {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    white-space: nowrap;
  }
  .title .directions .key {
    display: inline-grid;
    place-items: center;
    width: 1.9rem;
    height: 1.9rem;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    background: var(--surface);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 1rem;
    box-shadow: 0 1px 0 var(--border);
  }
  .title .directions .key.down { animation: title-nudge 2.4s ease-in-out infinite; }
  @keyframes title-nudge {
    0%, 100% { translate: 0 0; }
    50%      { translate: 0 3px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .title .gifs img { animation: none; opacity: 0.35; }
    .title .directions .key.down { animation: none; }
  }
</style>

  <div class="gifs" aria-hidden="true"></div>
  <div class="wash" aria-hidden="true"></div>

  <div class="hero">
    <div>
      <h1>Why do physics engines break?</h1>
    </div>
  </div>

  <footer class="directions" aria-label="How to navigate">
    <div><span class="key" aria-hidden="true">←</span><span>surface</span></div>
    <div><span class="key down" aria-hidden="true">↓</span><span>next page</span></div>
    <div><span class="key" aria-hidden="true">→</span><span>deep dive</span></div>
  </footer>
</section>
