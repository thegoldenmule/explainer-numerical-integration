<!doctype html>
<!--
  Serve over HTTP; file:// cannot load ES modules, import maps, or fetch() pane prose.
    cd app && python3 -m http.server 8765 --bind 127.0.0.1
    open http://127.0.0.1:8765/
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Why physics engines blow up</title>
<!-- the Euler disk with an eigenvalue on its edge; inline so no route asks for /favicon.ico -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='16' r='12' fill='%234079d9'/%3E%3Ccircle cx='23' cy='9' r='4' fill='%23d43a2f'/%3E%3C/svg%3E">

<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/layout.css">
<link rel="stylesheet" href="./styles/controls.css">

<!-- Bare-prefix imports for every module in the app. Panels import 'shared/...' and the
     loader imports 'panels/<slug>/<pane>.js' on demand through this same map. -->
<script type="importmap">
{
  "imports": {
    "shared/": "./shared/",
    "panels/": "./panels/"
  }
}
</script>

<!-- shared/ arrives with the page instead of in an import waterfall -->
<link rel="modulepreload" href="./shared/main.js">
<link rel="modulepreload" href="./shared/manifest.js">
<link rel="modulepreload" href="./shared/state.js">
<link rel="modulepreload" href="./shared/scene.js">
<link rel="modulepreload" href="./shared/aux.js">
<link rel="modulepreload" href="./shared/router.js">
<link rel="modulepreload" href="./shared/loader.js">
<link rel="modulepreload" href="./shared/dom.js">
<link rel="modulepreload" href="./shared/player.js">
<link rel="modulepreload" href="./shared/math/complex.js">
<link rel="modulepreload" href="./shared/math/system.js">
<link rel="modulepreload" href="./shared/math/integrators.js">
<link rel="modulepreload" href="./shared/math/matrix2.js">
<link rel="modulepreload" href="./shared/math/stability.js">
<link rel="modulepreload" href="./shared/math/taylor.js">
<link rel="modulepreload" href="./shared/math/forces.js">
<link rel="modulepreload" href="./shared/math/modes.js">
<link rel="modulepreload" href="./shared/math/adaptive.js">
<link rel="modulepreload" href="./shared/math/sweep.js">
<link rel="modulepreload" href="./shared/gfx/plot2d.js">
<link rel="modulepreload" href="./shared/gfx/color.js">
<link rel="modulepreload" href="./shared/gfx/region-gl.js">
<link rel="modulepreload" href="./shared/gfx/cplane.js">
<link rel="modulepreload" href="./shared/gfx/loop.js">
<link rel="modulepreload" href="./shared/gfx/stage.js">
<link rel="modulepreload" href="./shared/gfx/trajectory.js">
<link rel="modulepreload" href="./shared/gfx/bundle.js">
<link rel="modulepreload" href="./shared/gfx/drag.js">
<link rel="modulepreload" href="./shared/ui/controls.js">
<link rel="modulepreload" href="./shared/ui/transport.js">
<link rel="modulepreload" href="./shared/ui/livemath.js">
<link rel="modulepreload" href="./shared/ui/scrub.js">
<link rel="modulepreload" href="./shared/ui/sweep.js">
</head>
<body>
<a class="skip" href="#spine">Skip to content</a>

<!-- The spine: one full-viewport row per outline step, filled by shared/main.js. Each row
     scroll-snaps horizontally between its left pane, spine pane, and right pane. -->
<main id="spine" aria-label="Explainer"></main>

<!-- Depth: a frame that darkens with how far right the current row is scrolled. Decoration
     only; layout.css owns the gradient, main.js drives its opacity from the scroll offset. -->
<div id="vignette" aria-hidden="true"></div>

<!-- Rails: one dot per panel on the right edge (up/down), one dot per pane on the bottom
     edge (left/right). Same dots, same meaning: filled is where you are. -->
<nav id="rail" class="rail" aria-label="Panels"></nav>
<nav id="hrail" class="rail" aria-label="Panes"></nav>

<noscript><p class="noscript">This explainer is interactive and needs JavaScript.</p></noscript>
<script type="module" src="./shared/main.js"></script>
</body>
</html>
